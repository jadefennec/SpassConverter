<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0e1a"/>
  <!-- Subtle grid lines -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a2035" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent circle glow -->
  <circle cx="180" cy="315" r="280" fill="url(#accent-glow)"/>
  <!-- Shield icon -->
  <g transform="translate(100, 215)">
    <rect width="160" height="160" rx="20" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1.5"/>
    <path d="M80 18 L120 36 L120 72 C120 98 103 120 80 130 C57 120 40 98 40 72 L40 36 Z" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64 80 L75 91 L98 65" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Main headline -->
  <text x="310" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="700" fill="#f1f5f9" letter-spacing="-1">SPASS Converter</text>
  <!-- Subheadline -->
  <text x="310" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Samsung Pass → Google Password Manager</text>
  <!-- Divider -->
  <rect x="310" y="350" width="580" height="2" fill="#0d9488" fill-opacity="0.5" rx="1"/>
  <!-- Three pillars -->
  <text x="310" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#14b8a6" font-weight="500">✓ 100% offline</text>
  <text x="510" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#14b8a6" font-weight="500">✓ No internet permissions</text>
  <text x="790" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#14b8a6" font-weight="500">✓ Free &amp; open source</text>
  <!-- .spass → CSV arrow -->
  <rect x="310" y="450" width="140" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="482" font-family="'Courier New', monospace" font-size="22" fill="#f1f5f9" text-anchor="middle">.spass</text>
  <path d="M 460 475 L 530 475" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/>
    </marker>
  </defs>
  <text x="495" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#0d9488" text-anchor="middle">convert</text>
  <rect x="540" y="450" width="140" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="482" font-family="'Courier New', monospace" font-size="22" fill="#f1f5f9" text-anchor="middle">.csv</text>
  <!-- GitHub URL -->
  <text x="310" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#475569">github.com/stanley-projects/SpassConverter</text>
  <!-- Android badge -->
  <rect x="820" y="540" width="220" height="42" rx="8" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1.5"/>
  <text x="930" y="567" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#14b8a6" text-anchor="middle" font-weight="500">Android 8.0+ · MIT License</text>
</svg>
