name: Build Android app

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-license: true

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "All four release signing secrets must be configured together." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          escape_property() {
            printf '%s' "$1" | sed 's/\\/\\\\/g'
          }
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$keystore"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$(escape_property "$RELEASE_STORE_PASSWORD")"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$(escape_property "$RELEASE_KEY_ALIAS")"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$(escape_property "$RELEASE_KEY_PASSWORD")"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signed release APK
        if: ${{ github.event_name != 'pull_request' && env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spass-converter-${{ github.event_name == 'pull_request' && 'unsigned-validation' || 'signed-release' }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
